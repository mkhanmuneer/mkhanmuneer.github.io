- title: "Three-Stream Patient Phenotyping: Feature-Space Structure, Not Algorithm Choice, Drives Cluster Quality"
  subtitle: "Clustering 69,987 diabetic patients along three orthogonal axes — who they are administratively, what brought them in clinically, and how they are medicated — with cross-algorithm agreement as the quality test and the readmission outcome held out until the end."
  author: "Muhammad Khan Muneer"
  date: "2025-06-10"
  date-format: "MMMM YYYY"
  description: |
    Label-free segmentation of a 69,987-patient diabetic cohort along three independently-clustered feature streams. **The headline:** cluster quality is set by the feature space, not the algorithm. The clinical/utilisation stream's continuous features give the most robust partition — K-Means and Ward agree at ARI 0.92 on five diagnosis-defined phenotypes. The medication stream's ordinal grid gives the highest raw separation (silhouette 0.56, nine treatment archetypes) but is a discrete lattice, not hidden clinical structure. The administrative stream's one-hot categoricals give an honest negative — cross-algorithm ARI 0.42, a degenerate Gaussian mixture, a 68% mega-cluster. **Cross-stream:** all three pairwise Cramér's V are below 0.10 — the axes are genuinely independent. **Post-hoc:** readmission rate is flat across every cluster (±1.5 points around the 7.3% patient-level baseline).
