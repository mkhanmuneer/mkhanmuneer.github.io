- title: "From a Calibrated Readmission Scorer to a Governed Targeting Decision: A CHEERS-Aligned PSA, a Pre-Registered Scenario Grid, and a Stepped-Wedge Trial Proposal"
  subtitle: "The most effective intervention applied to the broadest cohort is the worst cell in the grid. A 10,000-draw probabilistic sensitivity analysis, a 3×3 capacity grid with a decision rule fixed in advance, and a confirmatory trial design for the one causal signal that survived."
  author: "Muhammad Khan Muneer"
  date: "2025-05-13"
  date-format: "MMMM YYYY"
  description: |
    Converting a calibrated 30-day readmission scorer into an operational targeting decision, framed as a CHEERS-aligned health-economic evaluation. **The counterintuitive core:** RN transitional care at the broad-screening threshold destroys about $430k/month of value — its 21% precision cannot justify $900/patient. **The recommendation:** broad screening (threshold 0.15) with pharmacist medication-reconciliation calls — **$587k/month net benefit, ~65 readmissions avoided, 100% coverage** — identical in all three capacity regimes. **Uncertainty:** a 10,000-draw PSA puts P(net benefit > 0) at 97% for that cell; a CEAC shows all three interventions clearing 95% cost-effectiveness at a willingness-to-pay of $15k. **The trial:** a stepped-wedge cluster RCT for the injury/orthopedics HbA1c signal — n ≈ 483, 8 sites, 18 months, ~$1.75M. **Fairness:** the 2.3× spread in benefit-per-1,000 across payer groups shrinks to 1.5× among the four large groups and reflects real risk, not bias.
