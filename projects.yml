- title: "A Clinical ML Equity Audit: Age-Band Disparities, Risk-Factor Detection Asymmetry, and Fairness Metrics"
  subtitle: "Decomposing a stroke-screening model's headline recall across five clinical and demographic subgroups — and showing that a single overall number conceals a structural age-band failure."
