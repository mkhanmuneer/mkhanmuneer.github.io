  date: "2024-08-12"
  date-format: "MMMM YYYY"
  description: |
    Five clustering algorithms and two projections applied to 407,826 Part 1 incidents across two independent streams. **Spatial (HDBSCAN):** 87 neighbourhood-scale hotspots covering 77% of incidents plus 23% dispersed "noise"; DBSCAN's single global radius fails, producing 14,620 one-per-street-corner micro-clusters. **Behavioural (K-Means k = 4):** street-level property (37%), violent crime with weapons (30%), indoor property (32%), and a non-repeat-location isolate (2%) — confirmed by GMM (ARI 0.91), only partly by agglomerative (ARI 0.42). **The headline:** the 87 hotspots and the 4 profiles are near-orthogonal (Cramér's V = 0.10); every hotspot carries the city-wide behavioural mix. Geography answers *where*, not *what kind* or *how severe*.
