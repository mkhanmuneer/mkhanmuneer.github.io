- title: "Admission-Time Length-of-Stay Forecasting: When MAE Selects the Wrong Model, and Poisson Deviance Selects the Right One"
  subtitle: "Predicting how many days an admission will last from information known at the door. A seven-model ladder, a predictive ceiling of R² 0.09, and a metric-selection trap — the model with the best MAE has the worst deviance of all seven, worse than always predicting the mean."
  author: "Muhammad Khan Muneer"
  date: "2025-06-24"
  date-format: "MMMM YYYY"
  description: |
    An admission-time length-of-stay regression on 99,340 diabetic inpatient encounters, evaluated on a patient-disjoint 19,812-encounter holdout. **The leakage discipline:** only the 23 features known at or before admission — 30 stay-accumulated clinical and medication columns are excluded with a stated reason each. **The predictive ceiling:** the champion (LightGBM, Poisson objective) reaches test R² 0.09, RMSE 2.85 days, MAE 2.21 days, barely ahead of the mean-only baseline's MAE of 2.35. Predictions collapse toward the centre — actual stays span 1–14 days, predicted stays barely leave 3–7. **The metric trap:** an ElasticNet fitted on log-transformed length of stay has the best test MAE (2.19) but the worst Poisson deviance of all seven models (1.888, above the baseline's 1.884) — its expm1 back-transform is a retransformation-biased point estimate that MAE cannot see. **The operational read:** a Youden-calibrated extended-stay flag (predicted stay ≥ 4.5 days) catches 60% of stays longer than a week at 63% specificity — an advisory signal, not a trigger (AUC 0.65).
