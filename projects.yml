- title: "Designing an A/B Test the Data Cannot Support at Face Value: A Feasibility Sweep, a Monte-Carlo-Validated Design, and a Recovered Hidden Effect"
  subtitle: "A pre-registered experiment on a 14,825-customer pool with no true no-offer control — the feasibility sweep rejects the obvious USD 2–5 MDEs, the design commits to the tightest feasible USD 7, and 2,000 full-pipeline simulations confirm 90% power and a 3.5% false-positive rate before the primary Welch test recovers an injected USD 8.40 lift to within 6.5%."
  author: "Muhammad Khan Muneer"
  date: "2026-11-10"
  date-format: "MMMM YYYY"
  description: |
    A methods demonstration: how to design a trustworthy randomised experiment on a dataset that cannot supply a clean control arm. **The constraint:** only 6 of 17,000 customers received zero offers, so "offer vs no offer" is structurally impossible; the control outcome is observed 30-day spend and the treatment effect is injected synthetically, declared, then recovered with the truth hidden. **The feasibility sweep:** a USD 2 MDE needs ~52,000 customers per arm against a ~14,800 pool; USD 5 needs ~8,400; **only MDE ≥ USD 7 (≈6% relative lift, 4,263 per arm) is deliverable** — and filtering to transacting customers does *not* reduce the outcome SD. **Validation before inference:** 2,000 full-pipeline Monte Carlo runs give realised power 90.1% (Wilson 95% CI [88.1, 91.8]) and realised Type I error 3.5% ([2.5, 4.8]) — both guarantees confirmed empirically. **The result:** a one-sided Welch t-test recovers an observed lift of USD 8.95 against the injected USD 8.40 (6.5% error), t = 2.95, p = 0.0016, one-sided 95% lower bound USD 3.96; the transaction-count guardrail is silent (p = 0.39).
