- title: "Measuring a Predictive Ceiling — Leakage-Restricted Regression of a Crime-Severity Score"
  subtitle: "The target is a synthetic index built from the offence category and the weapon. Withhold both — as you must, or the model just re-does the arithmetic — and eighteen model variants across four families all land between R² 0.08 and 0.13. Context (when, where, to whom) explains almost nothing about how severe an incident is."
  author: "Muhammad Khan Muneer"
  date: "2024-09-09"
  date-format: "MMMM YYYY"
  description: |
    A regression whose result is the low ceiling itself. **The target,** `CrimeSeverityScore`, is `(base severity of the offence category × 10) + weapon-severity index` — a banded ordinal with 23 distinct values, 70% of its mass at scores 11 and 21. **The discipline:** the seven columns that are inputs to that formula are excluded before any model is fit; the 14 remaining features are pure context. **The result:** the champion (LightGBM) reaches R² **0.13** and RMSE **11.4** on a held-out year — barely ahead of predicting the mean (RMSE 12.3). All 18 variants span a 3.2% RMSE range. Predictions collapse toward the centre (predicted SD 5.5 vs actual 12.2) and every high-severity incident is under-predicted by 8–20 points. Context does not tell you how severe a crime is; the offence category does, and that was correctly withheld.
