- title: "Does HbA1c Testing Cause Lower 30-Day Readmission? A Disciplined Null, With a Trauma-Subgroup Signal"
  subtitle: "The naive observational comparison says HbA1c testing is protective. Three causal estimators, a 19% positivity trim, and two sensitivity analyses say the population-level effect is indistinguishable from zero — but a large protective signal survives in injury and orthopedic admissions."
  author: "Muhammad Khan Muneer"
  date: "2025-04-22"
  date-format: "MMMM YYYY"
  description: |
    A from-scratch causal analysis of whether ordering an HbA1c test during a diabetic inpatient admission reduces 30-day readmission risk. **The naive signal:** −0.72 percentage points (95% CI [−1.25, −0.18]) — testing looks protective. **Positivity is a problem:** the treatment-assignment model reaches AUC 0.92, and 19% of patients have a propensity below 0.01 or above 0.99; trimming to the discretionary-testing region leaves 56,723 patients and drops the treatment rate from 18% to 7%. **Three estimators disagree in sign:** IPW −0.38 pp, AIPW −0.87 pp, 1:1 matching +0.11 pp — and **every causal 95% CI crosses zero**. **Sensitivity:** an unmeasured confounder at a risk ratio of 1.45 fully explains the AIPW effect, and the CI-bound E-value is 1.00. **The exception:** a −6.5-point effect in injury admissions and −8.2 points in orthopedics, the only two strata whose CIs clearly exclude zero — hypothesis-generating, not confirmatory.
