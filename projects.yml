  subtitle: "The Violent/Property champion from a companion study is audited for recall consistency across gender, race, age, and district, at two decision thresholds. Age and the ‘unrecorded demographic’ slices carry the widest miss-rate gaps; district is an order of magnitude tighter. And when the audit is repeated on the leakage-controlled model, every gap roughly doubles."
