- title: "Classifying Violent versus Property Crime — A Target-Leakage Audit and the Honest AUC"
  subtitle: "A binary classifier on 407,826 Part 1 incidents that scores ROC-AUC 0.988 on a held-out future year — until one engineered feature is recognised as a deterministic transform of the label. Re-fitting the identical model without it gives the honest figure: 0.913."
