  date: "2024-07-08"
  date-format: "MMMM YYYY"
  description: |
    A supervised-classification study that turns into a leakage audit. **The reported model:** an XGBoost classifier distinguishing Violent from Property Crime, ROC-AUC **0.988** on a 2021–2022 temporal hold-out, chosen over five other architectures. **The problem:** its top feature, `CrimeSeverityScore`, is `(BaseCrimeSeverity × 10) + WeaponSeverityIndex` — and `BaseCrimeSeverity` is a fixed lookup from the offence category, which maps one-to-one onto the crime-type label. That one feature carries **71%** of the model's SHAP weight and reaches AUC **0.92** alone. **The honest number:** re-fitting the exact champion configuration without it — same split, same seed — gives ROC-AUC **0.913**; also dropping the recorded-weapon field drops it to **0.67**, so weapon information, not time, place, or demographics, carries the signal.
