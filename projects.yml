- title: "Two-Stream Unsupervised Segmentation of Urban Crime — Spatial Hotspots versus Behavioural Profiles"
  subtitle: "Geography and behaviour are clustered on deliberately separate feature matrices for 407,826 incidents: HDBSCAN finds 87 density hotspots, K-Means finds four behavioural profiles, and a cross-stream test (Cramér's V = 0.10) shows the two partitions are almost independent — where crime concentrates tells you almost nothing about what kind it is."
