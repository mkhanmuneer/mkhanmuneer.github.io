- title: "A Calibrated 30-Day Readmission Model at the Cohort's Signal Ceiling: Cross-Family Convergence, Isotonic Calibration, and a Fairness Audit"
  subtitle: "Four model families, a three-tier imbalance ladder, and a held-out test set of 20,031 admissions — the honest ROC-AUC is 0.67, the useful operating threshold is 0.15 not 0.5, and the loudest fairness signal turns out to be calibrated."
